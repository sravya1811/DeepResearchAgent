[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Multi-agent web research assistant built on the OpenAI Agents SDK"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.14.0",
    "openai>=2.34.0",
    "openai-agents>=0.15.1",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:anyio"
pythonpath = ["."]
testpaths = ["tests"]
